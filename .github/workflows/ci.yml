name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project has no Gradle wrapper. Use the same Gradle 8 / JDK 21 image
      # as the Dockerfile build stage so Renovate updates are checked consistently.
      - name: Test
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/app"
          -w /app
          gradle:8-jdk21
          gradle check --no-daemon

  docker:
    name: docker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t template-kotlin .
